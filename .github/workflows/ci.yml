name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      diagnostics:
        description: "Run the normal hermetic checks with step diagnostics enabled"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  GO_VERSION: "1.26.8"
  GOTOOLCHAIN: local

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@25e2cdc5eb1d7a04fdc45ff538f1a00e960ae128 # v8.0.0
        with:
          version: v2.13.2
          args: --modules-download-mode=readonly

  test:
    runs-on: ubuntu-latest
    env:
      # Public CI must never inherit or synthesize workspace authentication.
      DATABRICKS_CONFIG_PROFILE: ""
      DATABRICKS_HOST: ""
      DATABRICKS_TOKEN: ""
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Toolchain diagnostics
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostics }}
        run: |
          go version
          go env GOOS GOARCH GOVERSION GOTOOLCHAIN CGO_ENABLED
          git status --short

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: Hermetic unit tests
        run: go test -mod=readonly ./... -race

      - name: Reproducible embedded-helper byte check
        run: ./scripts/embedded-helpers.sh check all

      - name: Offline embedded-helper smoke tests
        run: ./scripts/embedded-helpers.sh smoke all

  cross-compile:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -mod=readonly -trimpath -buildvcs=false -o /tmp/buzz-backend-databricks-lakebox ./cmd/buzz-backend-databricks-lakebox

  goreleaser:
    runs-on: ubuntu-latest
    needs: [lint, test, vulncheck, cross-compile]
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: GoReleaser configuration check
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          distribution: goreleaser
          version: v2.18.1
          args: check

      - name: GoReleaser snapshot dry-run
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          distribution: goreleaser
          version: v2.18.1
          args: release --snapshot --clean

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: npm audit (committed adapter lockfiles)
        run: |
          set -eu
          rc=0
          for lock in internal/install/lockfiles/*.package-lock.json; do
            name=$(basename "$lock" .package-lock.json)
            work=$(mktemp -d)
            cp "$lock" "$work/package-lock.json"
            python3 - "$work" <<'PYEOF'
          import json, sys, os
          work = sys.argv[1]
          lock = json.load(open(os.path.join(work, "package-lock.json")))
          root = lock["packages"][""]
          json.dump({
              "name": lock["name"],
              "version": lock.get("version", "0.0.0"),
              "private": True,
              "dependencies": root.get("dependencies", {}),
          }, open(os.path.join(work, "package.json"), "w"))
          PYEOF
            echo "::group::npm audit $name"
            (cd "$work" && npm audit --package-lock-only --audit-level=high) || rc=1
            echo "::endgroup::"
            rm -rf "$work"
          done
          exit $rc
