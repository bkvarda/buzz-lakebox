name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  GO_VERSION: "1.26.8"
  GOTOOLCHAIN: local

jobs:
  verify:
    name: Full hermetic verification
    runs-on: ubuntu-latest
    env:
      DATABRICKS_CONFIG_PROFILE: ""
      DATABRICKS_HOST: ""
      DATABRICKS_TOKEN: ""
    steps:
      - name: Check out tagged source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Verify tag names checked-out commit
        run: test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$GITHUB_REF")"

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: Hermetic unit tests
        run: go test -mod=readonly ./... -race

      - name: Reproducible embedded-helper byte check
        run: ./scripts/embedded-helpers.sh check all

      - name: Offline embedded-helper smoke tests
        run: ./scripts/embedded-helpers.sh smoke all

      - name: golangci-lint
        uses: golangci/golangci-lint-action@25e2cdc5eb1d7a04fdc45ff538f1a00e960ae128 # v8.0.0
        with:
          version: v2.13.2
          args: --modules-download-mode=readonly

      - name: GoReleaser configuration check
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          distribution: goreleaser
          version: v2.18.1
          args: check

      - name: Confirm verification did not mutate tagged inputs
        run: git diff --exit-code && test -z "$(git status --short)"

  publish:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Publish with GoReleaser
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          distribution: goreleaser
          version: v2.18.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
