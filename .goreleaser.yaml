version: 2

project_name: buzz-backend-databricks-lakebox

# Tagged source is immutable. Generation, tidy, and other mutating hooks are
# intentionally absent; the release workflow verifies committed helper bytes
# before invoking GoReleaser.
builds:
  - id: buzz-backend-databricks-lakebox
    main: ./cmd/buzz-backend-databricks-lakebox
    binary: buzz-backend-databricks-lakebox
    env:
      - CGO_ENABLED=0
    flags:
      - -mod=readonly
      - -trimpath
      - -buildvcs=false
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -buildid= -X github.com/IceRhymers/buzz-lakebox/internal/version.Version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true
